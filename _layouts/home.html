---
layout: default
---

<header class="site-masthead">
  {% include menu.html %}
  {% if site.title %}
    <h1>
      {{ site.title }}
    </h1>
  {% endif %}
  {% if site.title %}
    <h2>
      {{ site.description }}
    </h2>
  {% endif %}
</header>

<main class="home" id="main" role="main" aria-label="Content">

  <h1 class="content-title divided">
    Contents
  </h1>

  <div class="genre-links">
    <a href="{{ '/fiction/' | prepend: site.baseurl }}" class="genre-link">
      <span class="genre-link__title">Fiction</span>
      <span class="genre-link__count">{{ site.categories.fiction | size }} pieces and counting</span>
    </a>
    <a href="{{ '/poetry/' | prepend: site.baseurl }}" class="genre-link">
      <span class="genre-link__title">Poetry</span>
      <span class="genre-link__count">{{ site.categories.poetry | size }} pieces and counting</span>
    </a>
  </div>

</main>
